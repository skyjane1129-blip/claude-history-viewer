<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude 历史对话浏览器</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="brand">Claude 历史</span>
        <span class="live-dot" id="live-dot" title="实时连接状态"></span>
      </div>

      <nav class="nav-tabs" id="nav-tabs">
        <button class="nav-tab active" data-view="history">对话</button>
        <button class="nav-tab" data-view="usage">用量</button>
        <button class="nav-tab" data-view="skills">Skills</button>
        <button class="nav-tab" data-view="rules">Rules</button>
      </nav>

      <div class="project-list" id="project-list"></div>
    </aside>

    <div class="main-area" id="main-area"></div>
  </div>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" id="modal-content"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/markdown.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
