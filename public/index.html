<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude 历史对话浏览器</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="brand">Claude 历史</span>
        <span class="live-dot" id="live-dot" title="实时连接状态"></span>
      </div>
      <div class="project-list" id="project-list"></div>
    </aside>

    <section class="conv-panel">
      <div class="conv-panel-header">
        <input id="search-input" class="search-input" type="text" placeholder="搜索标题或项目名..." />
      </div>
      <div class="conv-list" id="conv-list"></div>
    </section>

    <main class="detail-panel" id="detail-panel">
      <div class="empty-state" id="empty-state">
        <p>从左侧选择一个对话</p>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" id="modal-content"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/markdown.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
